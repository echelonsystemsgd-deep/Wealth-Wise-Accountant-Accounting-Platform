<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C0A262" />
      <stop offset="100%" stop-color="#CDBA7A" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Gold Accent Border -->
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="#C0A262" stroke-width="2" opacity="0.3" />

  <!-- Main Title -->
  <text x="100" y="240" font-family="'DM Serif Display', Georgia, serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">
    Wealthwise Accountants
  </text>
  <text x="100" y="300" font-family="'Inter', sans-serif" font-size="28" font-weight="500" fill="url(#goldGrad)">
    Accounting, Tax, Bookkeeping, VAT &amp; Payroll Support
  </text>

  <!-- Value propositions -->
  <text x="100" y="390" font-family="'Inter', sans-serif" font-size="20" fill="#D1D5DB" font-weight="400">
    • Clarity in every number. Confidence in every decision.
  </text>
  <text x="100" y="430" font-family="'Inter', sans-serif" font-size="20" fill="#D1D5DB" font-weight="400">
    • Dedicated practice software &amp; client review prototype.
  </text>

  <!-- Footer badge -->
  <g transform="translate(100, 500)">
    <rect width="360" height="36" rx="6" fill="#111111" stroke="#C0A262" stroke-width="1" />
    <text x="180" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#C0A262" text-anchor="middle">
      65 Waterloo Road, Smethwick, B66 4JS
    </text>
  </g>
</svg>
