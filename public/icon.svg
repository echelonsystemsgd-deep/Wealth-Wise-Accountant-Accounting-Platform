  <rect width="128" height="128" rx="28" fill="#000000" />
  
  <!-- Warm Gold Precision Border -->
  <rect x="2" y="2" width="124" height="124" rx="26" stroke="#C0A262" stroke-width="2.5" fill="none" opacity="0.8"/>
  
  <!-- Subtle Inner Accent -->
  <rect x="6" y="6" width="116" height="116" rx="22" stroke="#CDBA7A" stroke-width="1" fill="none" opacity="0.3"/>
  
  <!-- Warm Gold Precision Diamond Accent -->
  <path d="M100 24 L105 29 L100 34 L95 29 Z" fill="#C0A262" />
  
