  <!-- Subtle inner gradient border -->
  <rect x="2" y="2" width="124" height="124" rx="26" stroke="#334155" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Warm Gold Precision Accent Dot -->
